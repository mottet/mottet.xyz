<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141c17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Maïa">
  <title>Maïa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preload" href="/assets/fonts/federo-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/maia.css?v=maia-2">
  <script>
    // Night mode before paint: the saved choice, else the phone's.
    try { var t = localStorage.getItem('maia-theme'); if (t === 'night' || t === 'day') document.documentElement.dataset.theme = t; else document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'; } catch (e) { document.documentElement.dataset.theme = 'day'; }
  </script>
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/maia-i18n.js?v=maia-2" defer></script>
  <script src="/maia-art.js?v=maia-2" defer></script>
  <script src="/maia.js?v=maia-2" defer></script>
</head>
<body>
  <div id="app" class="page" aria-live="polite" aria-busy="true"></div>
  <noscript><p class="page" style="text-align:center">This site needs JavaScript.</p></noscript>
</body>
</html>

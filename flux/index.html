<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux — qui paie quoi, qui reçoit quoi</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem auto;max-width:40rem;padding:0 1rem;color:#222;background:#fafaf7}code{font-size:.9em}</style>
</head>
<body>
<h1>Flux</h1>
<p>Les flux d'argent des administrations publiques françaises : qui paie quoi, qui reçoit quoi. Le site est en construction ; les données sont déjà là.</p>
<ul id="shards"><li>Chargement de <code>graph/index.json</code>…</li></ul>
<script type="module">
const r = await fetch('graph/index.json'); const index = await r.json();
const ul = document.getElementById('shards'); ul.innerHTML = '';
const li = t => { const e = document.createElement('li'); e.textContent = t; ul.appendChild(e); };
li(`Édition ${index.release}, construite le ${index.built} : ${index.counts.nodes} nœuds, ${index.counts.edges} flux, années ${index.years.join(', ')}.`);
for (const [k, f] of Object.entries(index.shards.edges)) li(`${k} → ${f}`);
</script>
</body>
</html>

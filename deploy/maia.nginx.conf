# maia.mottet.xyz, Maia's site, served by the same Node.js app as the house.
# Install to /etc/nginx/sites-available/maia.mottet.xyz, enable it, then let
# Certbot add the TLS listeners and the HTTP to HTTPS redirect:
#   sudo certbot --nginx -d maia.mottet.xyz --redirect
server {
    listen 80;
    listen [::]:80;
    server_name maia.mottet.xyz;

    # A private family site: never indexed, photos up to 10 MB.
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 10m;

    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

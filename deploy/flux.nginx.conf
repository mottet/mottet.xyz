# flux.mottet.xyz, the money flows of the French public administrations,
# served by the same Node.js app as the house (see ../flux-server.js).
# Install to /etc/nginx/sites-available/flux.mottet.xyz, enable it, then let
# Certbot add the TLS listeners and the HTTP to HTTPS redirect:
#   sudo certbot --nginx -d flux.mottet.xyz --redirect
server {
    listen 80;
    listen [::]:80;
    server_name flux.mottet.xyz;

    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
